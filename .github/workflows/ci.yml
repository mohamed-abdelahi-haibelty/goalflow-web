name: Quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://localhost:5432/goalflow
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-placeholder-secret-not-a-production-credential
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm exec prisma validate
      - run: pnpm check
      - run: pnpm format:check
      - run: pnpm build
